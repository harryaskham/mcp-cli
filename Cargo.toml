[package]
name = "mcp-cli-core"
description = "Reusable JSON envelope and MCP stdio helpers for CLI projects"
version = "0.0.1"
edition = "2024"
license = "MIT"
rust-version = "1.85"
readme = "README.md"
repository = "https://github.com/harryaskham/mcp-cli"
homepage = "https://github.com/harryaskham/mcp-cli"
documentation = "https://github.com/harryaskham/mcp-cli/blob/main/README.md"
keywords = ["cli", "json", "mcp"]
categories = ["command-line-utilities", "development-tools"]

[lib]
# The PACKAGE is `mcp-cli-core` because `mcp-cli` on crates.io belongs to an
# unrelated project (bd-26b8a3). The LIBRARY keeps the original `mcp_cli` name
# so existing consumers' `use mcp_cli::...` continues to compile unchanged; a
# git/path consumer only has to rename the dependency key, or keep it and add
# `package = "mcp-cli-core"`.
name = "mcp_cli"
path = "src/lib.rs"

[dependencies]
schemars = { version = "1.0.4", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"

[dev-dependencies]
clap = { version = "4.5.37", features = ["derive"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
